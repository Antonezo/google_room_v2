<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google Room - Final Clean</title>
    <meta name="theme-color" content="#0b0f17" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3CradialGradient id='blueGrad' cx='30%25' cy='30%25' r='70%25'%3E%3Cstop offset='0%25' stop-color='%23fff'/%3E%3Cstop offset='100%25' stop-color='%234285F4'/%3E%3C/radialGradient%3E%3CradialGradient id='redGrad' cx='30%25' cy='30%25' r='70%25'%3E%3Cstop offset='0%25' stop-color='%23fff'/%3E%3Cstop offset='100%25' stop-color='%23EA4335'/%3E%3C/radialGradient%3E%3CradialGradient id='yellowGrad' cx='30%25' cy='30%25' r='70%25'%3E%3Cstop offset='0%25' stop-color='%23fff'/%3E%3Cstop offset='100%25' stop-color='%23FBBC05'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='45' r='40' fill='url(%23blueGrad)'/%3E%3Ccircle cx='72' cy='68' r='26' fill='url(%23redGrad)'/%3E%3Ccircle cx='38' cy='72' r='20' fill='url(%23yellowGrad)'/%3E%3C/svg%3E"
      type="image/svg+xml"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="loading">
    <div id="loader-doors">
      <div class="loader-background-arcs">
        <div class="arc arc-1"></div>
        <div class="arc arc-2"></div>
        <div class="arc arc-3"></div>
      </div>

      <div class="door left-door">
        <div class="hex-pattern"></div>
        <div class="door-joint"></div>

        <div id="futuristic-start-menu" class="futuristic-start-menu">
          <div id="view-main" class="menu-view active">
            <button id="btn-start-game" class="sk-btn pulse-glow-volumetric">
              <span class="btn-text">NEW GAME</span>
              <span class="btn-dec">&gt;&gt;</span>
            </button>

            <button
              id="btn-resume-game"
              class="sk-btn resume-highlight"
              style="display: none"
            >
              <span class="btn-text">RESUME</span>
              <span class="btn-dec">&gt;&gt;</span>
              <div class="resume-energy-field"></div>
            </button>

            <button id="btn-open-settings" class="sk-btn">
              <span class="btn-text">SETTINGS</span>
            </button>

            <div id="btn-exit" class="sk-btn exit-btn">
              <span class="btn-text btn-text-default">EXIT</span>
              <span class="exit-joke">close the browser tab :)</span>
            </div>
          </div>

          <div id="view-settings" class="menu-view">
            <button id="btn-back-main" class="holo-back-tab">
              <span class="btn-dec">&lt;&lt;</span>
              <span class="btn-text">MAIN MENU</span>
            </button>

            <div class="settings-list">
              <div class="slider-group">
                <div class="slider-header">
                  <span class="btn-text">SFX VOLUME</span>
                  <span class="slider-value" id="val-sfx">70%</span>
                </div>
                <input
                  type="range"
                  id="slider-sfx"
                  class="cyber-slider"
                  min="0"
                  max="100"
                  value="70"
                />
              </div>

              <div class="slider-group">
                <div class="slider-header">
                  <span class="btn-text">MUSIC VOLUME</span>
                  <span class="slider-value" id="val-music">40%</span>
                </div>
                <input
                  type="range"
                  id="slider-music"
                  class="cyber-slider"
                  min="0"
                  max="100"
                  value="40"
                />
              </div>

              <div id="btn-toggle-lang" class="lang-group slider-group">
                <div
                  class="slider-header"
                  style="
                    pointer-events: none;
                    width: 100%;
                    border-bottom: 1px solid rgba(0, 243, 255, 0.2);
                    padding-bottom: 5px;
                  "
                >
                  <span class="btn-text">LANGUAGE</span>
                  <span class="status slider-value">EN</span>
                </div>
                <div class="lang-options">
                  <button class="lang-btn active-lang" data-lang="EN">
                    <span class="btn-text">ENGLISH</span>
                  </button>
                  <button class="lang-btn" data-lang="RU">
                    <span class="btn-text">РУССКИЙ</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="door right-door">
        <div class="hex-pattern"></div>
        <div class="door-joint"></div>
      </div>

      <div class="loader-center-hub">
        <div class="vertical-joint-line"></div>

        <div class="cyber-panel">
          <div class="panel-logo-core"></div>
          <div class="panel-footer-shared">by Gemini</div>
        </div>
      </div>
    </div>

    <div id="loader">
      System Loading...<br /><span
        style="font-size: 14px; font-weight: normal; color: #666"
        >Initializing Physics</span
      >
    </div>

    <div id="hud-controls">
      <button id="btn-in-game-menu">
        <span class="btn-text">MENU</span>
      </button>
    </div>

    <div id="holo-wrapper">
      <div id="terminal-handle"><div id="handle-icon">SYSTEM</div></div>
      <div id="holo-panel">
        <div class="section-title">WORD SELECTOR</div>
        <div class="word-control">
          <input
            type="text"
            id="word-input"
            value="GOOGLE"
            maxlength="8"
            autocomplete="off"
            spellcheck="false"
            placeholder="TYPE..."
          />
          <button id="btn-apply-word" class="icon-btn" data-action="applyWord">
            ✔️
          </button>
        </div>

        <div class="section-title">ATMOSPHERE MODE</div>
        <div class="mode-switch-container">
          <button
            id="mode-lab"
            class="mode-btn active"
            data-action="setModeLab"
          >
            LAB
          </button>
          <button id="mode-disco" class="mode-btn" data-action="setModeDisco">
            DISCO
          </button>
        </div>

        <div class="section-title">PHYSICS CONTROL</div>
        <div class="actions-grid">
          <div class="combo-wrapper">
            <button
              id="btn-letters"
              class="combo-main-btn active-state"
              data-action="toggleLetters"
            >
              <span class="btn-icon">Ab</span>Letters
            </button>
            <button
              id="btn-reset-letters"
              class="combo-reset-btn"
              data-action="returnLetters"
            >
              RETURN
            </button>
          </div>
          <div class="combo-wrapper">
            <button
              id="btn-balls"
              class="combo-main-btn"
              data-action="spawnBalls"
            >
              <span class="btn-icon"
                ><svg viewBox="0 0 24 24">
                  <circle cx="6" cy="15" r="4" />
                  <circle cx="18" cy="15" r="4" />
                  <circle cx="12" cy="7" r="4" /></svg></span
              >Beads
              <div id="bead-count" class="bead-counter">0/200</div>
            </button>
            <button
              id="btn-clear-balls"
              class="combo-reset-btn"
              title="Clear Beads"
              data-action="clearBalls"
            >
              CLEAR
            </button>
          </div>
          <button id="btn-slow" class="holo-btn" data-action="toggleSlowMo">
            <span class="btn-icon">🐢</span>Slo-Mo
          </button>
          <button id="btn-fans" class="holo-btn" data-action="toggleFans">
            <span class="btn-icon"
              ><svg class="stroked" viewBox="0 0 24 24">
                <path d="M6 20 Q4 16 6 12 T6 4" />
                <path d="M12 20 Q10 16 12 12 T12 4" />
                <path d="M18 20 Q16 16 18 12 T18 4" /></svg></span
            >Air Floor
          </button>
        </div>

        <div class="section-title">EQUIPMENT</div>
        <div class="equipment-rack">
          <div class="tool-wrapper">
            <button
              id="btn-mag-main"
              class="mag-main-btn"
              data-action="togglePaletteMag"
            ></button>
            <div class="palette-container mag-palette">
              <div
                id="mag-btn-0"
                class="palette-item item-0"
                data-color="0"
                data-action="selectPaletteColor"
                title="Green"
              ></div>
              <div
                id="mag-btn-1"
                class="palette-item item-1"
                data-color="1"
                data-action="selectPaletteColor"
                title="Yellow"
              ></div>
              <div
                id="mag-btn-2"
                class="palette-item item-2"
                data-color="2"
                data-action="selectPaletteColor"
                title="Red"
              ></div>
              <div
                id="mag-btn-3"
                class="palette-item item-3"
                data-color="3"
                data-action="selectPaletteColor"
                title="Blue"
              ></div>
            </div>
          </div>
          <div class="tool-wrapper">
            <button
              id="btn-paint-main"
              class="mag-main-btn paint-btn"
              data-action="togglePalettePaint"
            ></button>
            <div class="palette-container paint-palette">
              <div
                id="paint-btn-0"
                class="palette-item item-0"
                data-color="0"
                data-action="selectPaletteColor"
                title="Green"
              ></div>
              <div
                id="paint-btn-1"
                class="palette-item item-1"
                data-color="1"
                data-action="selectPaletteColor"
                title="Yellow"
              ></div>
              <div
                id="paint-btn-2"
                class="palette-item item-2"
                data-color="2"
                data-action="selectPaletteColor"
                title="Red"
              ></div>
              <div
                id="paint-btn-3"
                class="palette-item item-3"
                data-color="3"
                data-action="selectPaletteColor"
                title="Blue"
              ></div>
            </div>
          </div>
        </div>
        <div id="tool-hint">[ПКМ] — СБРОСИТЬ ИНСТРУМЕНТ</div>
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
          "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
        }
      }
    </script>
    <script type="module" src="js/main.js"></script>
    <div id="confirm-modal" class="modal-overlay hidden">
           
      <div class="cyber-modal">
        <div class="modal-text">Are you sure?<br /></div>
               
        <div class="modal-actions">
                   
          <button id="btn-confirm-yes" class="holo-btn active-state">
                        <span class="btn-text">YES</span>          
          </button>
                   
          <button id="btn-confirm-no" class="holo-btn">
                        <span class="btn-text">CANCEL</span>          
          </button>
                 
        </div>
             
      </div>
         
    </div>
  </body>
</html>
