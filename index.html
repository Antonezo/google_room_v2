<!doctype html>
<html lang="en" data-ui-lang="EN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google Room - Final Clean</title>
    <meta name="theme-color" content="#0b0f17" />
    <script>
      (() => {
        const savedLanguage = localStorage.getItem("google-room-language");

        const language = savedLanguage === "RU" ? "RU" : "EN";

        document.documentElement.dataset.uiLang = language;

        document.documentElement.lang = language.toLowerCase();
      })();
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3CradialGradient id='blueGrad' cx='30%25' cy='30%25' r='70%25'%3E%3Cstop offset='0%25' stop-color='%23fff'/%3E%3Cstop offset='100%25' stop-color='%234285F4'/%3E%3C/radialGradient%3E%3CradialGradient id='redGrad' cx='30%25' cy='30%25' r='70%25'%3E%3Cstop offset='0%25' stop-color='%23fff'/%3E%3Cstop offset='100%25' stop-color='%23EA4335'/%3E%3C/radialGradient%3E%3CradialGradient id='yellowGrad' cx='30%25' cy='30%25' r='70%25'%3E%3Cstop offset='0%25' stop-color='%23fff'/%3E%3Cstop offset='100%25' stop-color='%23FBBC05'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='45' r='40' fill='url(%23blueGrad)'/%3E%3Ccircle cx='72' cy='68' r='26' fill='url(%23redGrad)'/%3E%3Ccircle cx='38' cy='72' r='20' fill='url(%23yellowGrad)'/%3E%3C/svg%3E"
      type="image/svg+xml"
    />

    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/core.css" />
    <link rel="stylesheet" href="css/loader-menu.css" />
    <link rel="stylesheet" href="css/hud.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
<body class="loading initial-main-view">
    <div id="game-monitor">
      <div id="canvas-container"></div>
    </div>
    <div id="loader-doors">
      <div class="loader-background-arcs">
        <div class="arc arc-1"></div>
        <div class="arc arc-2"></div>
        <div class="arc arc-3"></div>
      </div>

      <div class="door left-door">
        <div class="hex-pattern"></div>
        <div class="pcb-texture"></div>
        <div class="door-joint"></div>

        <div id="futuristic-start-menu" class="futuristic-start-menu">
          <div id="view-main" class="menu-view active">
            <button
              id="btn-restart-sector"
              class="sk-btn"
              style="display: none"
            >
              <span class="btn-text">
                <span data-lang-text="EN">RESTART SECTOR</span>
                <span data-lang-text="RU">ПЕРЕЗАПУСТИТЬ СЕКТОР</span>
              </span>
            </button>

            <button id="btn-start-game" class="sk-btn pulse-glow-volumetric">
              <span class="btn-text">
                <span data-lang-text="EN">NEW GAME</span>
                <span data-lang-text="RU">НОВАЯ ИГРА</span>
              </span>
              <span class="btn-dec">&gt;&gt;</span>
            </button>
            <!-- ЗДЕСЬ ЗАКРЫВАЕМ КНОПКУ СТАРТА -->

            <!-- Блок подготовки теперь идет следом, А НЕ ВНУТРИ кнопки -->
            <div
              id="game-preparation-status"
              class="game-preparation-status"
              aria-live="polite"
            >
              <div class="preparation-header">
                <span id="preparation-title" class="preparation-title">
                  SYSTEM PREPARATION
                </span>
                <span id="preparation-percent" class="preparation-percent"
                  >0%</span
                >
              </div>

              <div class="preparation-progress-track">
                <div
                  id="preparation-progress-fill"
                  class="preparation-progress-fill"
                ></div>
              </div>

              <div id="preparation-stage" class="preparation-stage">
                Waiting to start...
              </div>
            </div>

            <button id="btn-open-sectors" class="sk-btn" style="display: none">
              <span class="btn-text">
                <span data-lang-text="EN">LOAD</span>
                <span data-lang-text="RU">ЗАГРУЗИТЬ</span>
              </span>
            </button>

            <button id="btn-return-title" class="sk-btn" style="display: none">
              <span class="btn-text">
                <span data-lang-text="EN">MAIN MENU</span>
                <span data-lang-text="RU">ГЛАВНОЕ МЕНЮ</span>
              </span>
            </button>

            <button id="btn-open-settings" class="sk-btn">
              <span class="btn-text">
                <span data-lang-text="EN">SETTINGS</span>
                <span data-lang-text="RU">НАСТРОЙКИ</span>
              </span>
            </button>

            <button id="btn-exit" class="sk-btn exit-btn">
              <span class="btn-text btn-text-default">
                <span data-lang-text="EN">EXIT</span>
                <span data-lang-text="RU">ВЫХОД</span>
              </span>
              <span class="exit-joke">
                <span data-lang-text="EN">LEAVE FULLSCREEN</span>
                <span data-lang-text="RU">ВЫЙТИ ИЗ ПОЛНОЭКРАННОГО РЕЖИМА</span>
              </span>
            </button>
          </div>
          <!-- ЗДЕСЬ ЗАКРЫВАЕТСЯ #view-main -->

          <div id="view-sectors" class="menu-view">
            <button id="btn-back-sectors" class="holo-back-tab">
              <span class="btn-dec">&lt;&lt;</span>

              <span class="btn-text">
                <span data-lang-text="EN">MAIN MENU</span>
                <span data-lang-text="RU">ГЛАВНОЕ МЕНЮ</span>
              </span>
            </button>

            <div class="sectors-list">
              <button class="sector-card" data-sector-id="1" type="button">
                <span class="sector-number">01</span>

                <span class="sector-info">
                  <span class="sector-title">SECTOR 1</span>
                  <span class="sector-status">CURRENT SECTOR</span>
                </span>
              </button>

              <button
                class="sector-card"
                data-sector-id="2"
                type="button"
                hidden
              >
                <span class="sector-number">02</span>

                <span class="sector-info">
                  <span class="sector-title">SECTOR 2</span>
                  <span class="sector-status">AVAILABLE</span>
                </span>
              </button>

              <button
                class="sector-card"
                data-sector-id="3"
                type="button"
                hidden
              >
                <span class="sector-number">03</span>

                <span class="sector-info">
                  <span class="sector-title">SECTOR 3</span>
                  <span class="sector-status">AVAILABLE</span>
                </span>
              </button>
            </div>
          </div>

          <div id="view-settings" class="menu-view">
            <!-- Главная страница настроек -->
            <div id="settings-main-panel" class="settings-panel active">
              <button id="btn-back-main" class="holo-back-tab">
                <span class="btn-dec">&lt;&lt;</span>
                <span class="btn-text">MAIN MENU</span>
              </button>

              <div class="settings-list">
                <div class="slider-group">
                  <div class="slider-header">
                    <span class="btn-text">SFX VOLUME</span>
                    <span class="slider-value" id="val-sfx">70%</span>
                  </div>

                  <input
                    type="range"
                    id="slider-sfx"
                    class="cyber-slider"
                    min="0"
                    max="100"
                    value="70"
                  />
                </div>

                <div class="slider-group">
                  <div class="slider-header">
                    <span class="btn-text">MUSIC VOLUME</span>
                    <span class="slider-value" id="val-music">40%</span>
                  </div>

                  <input
                    type="range"
                    id="slider-music"
                    class="cyber-slider"
                    min="0"
                    max="100"
                    value="40"
                  />
                </div>

                <button
                  id="btn-open-controls"
                  class="sk-btn settings-navigation-btn"
                >
                  <span class="btn-text">CONTROLS</span>
                  <span class="btn-dec">&gt;&gt;</span>
                </button>

                <div id="btn-toggle-lang" class="lang-group slider-group">
                  <div class="slider-header lang-header-style">
                    <span class="btn-text">LANGUAGE</span>

                    <span
                      id="current-language-status"
                      class="status slider-value"
                    >
                      EN
                    </span>
                  </div>

                  <div class="lang-options">
                    <button
                      class="lang-btn active-lang"
                      data-lang="EN"
                      aria-pressed="true"
                    >
                      <span class="btn-text">ENGLISH</span>
                    </button>

                    <button
                      class="lang-btn"
                      data-lang="RU"
                      aria-pressed="false"
                    >
                      <span class="btn-text">РУССКИЙ</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <!-- Вложенная страница управления -->
            <div id="settings-controls-panel" class="settings-panel">
              <button id="btn-back-controls" class="holo-back-tab">
                <span class="btn-dec">&lt;&lt;</span>
                <span class="btn-text">BACK TO SETTINGS</span>
              </button>

              <div class="controls-header">
                <div id="controls-title" class="controls-title">CONTROLS</div>
              </div>

              <div class="controls-list">
                <div class="control-row control-row-movement">
                  <span id="control-action-movement" class="control-action">
                    MOVEMENT
                  </span>

                  <span class="movement-controls">
                    <span class="wasd-grid" aria-label="W A S D">
                      <kbd class="key-w">W</kbd>
                      <kbd class="key-a">A</kbd>
                      <kbd class="key-s">S</kbd>
                      <kbd class="key-d">D</kbd>
                    </span>

                    <span class="movement-plus" aria-hidden="true">+</span>

                    <span
                      id="control-binding-mouse"
                      class="mouse-control"
                      aria-label="Mouse"
                    >
                      <svg
                        class="mouse-control-icon"
                        viewBox="0 0 32 44"
                        aria-hidden="true"
                      >
                        <rect x="5" y="2" width="22" height="40" rx="11"></rect>
                        <line x1="16" y1="3" x2="16" y2="15"></line>
                        <line x1="16" y1="8" x2="16" y2="13"></line>
                      </svg>

                      <span id="control-binding-mouse-text">MOUSE</span>
                    </span>
                  </span>
                </div>

                <div class="control-row">
                  <span id="control-action-jump" class="control-action">
                    JUMP
                  </span>

                  <span class="control-bindings">
                    <kbd>SPACE</kbd>
                  </span>
                </div>

                <div class="control-row">
                  <span id="control-action-pause" class="control-action">
                    PAUSE
                  </span>

                  <span class="control-bindings">
                    <kbd>ESC</kbd>
                  </span>
                </div>

                <div class="control-row">
                  <span id="control-action-restart" class="control-action">
                    RESTART SECTOR
                  </span>

                  <span class="control-bindings">
                    <kbd>R</kbd>
                  </span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="door right-door">
        <div class="hex-pattern"></div>
        <div class="pcb-texture"></div>
        <div class="door-joint"></div>

        <div class="title-container">
          <h1 class="cyber-title">GOOGLE ROOM</h1>
          <div class="cyber-subtitle">EXPERIMENTAL PHYSICS SANDBOX</div>
        </div>
      </div>

      <div class="loader-center-hub">
        <div class="vertical-joint-line"></div>

        <div class="cyber-core">
          <div class="core-ring outer-ring"></div>
          <div class="core-ring inner-ring"></div>
          <div class="core-center">
            <div class="core-text">A.I.C.E.</div>
            <div class="core-subtext">SYSTEMS</div>
          </div>
        </div>
      </div>
    </div>

    <!-- =====================================================
         БЫСТРОЕ МЕНЮ ПАУЗЫ ПОВЕРХ ИГРЫ
         ===================================================== -->
    <div id="pause-overlay" class="pause-overlay" aria-hidden="true">
      <section
        class="pause-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="pause-title"
      >
        <header class="pause-header">
          <div id="pause-system-label" class="pause-system-label">
            SYSTEM PAUSED
          </div>

          <h2 id="pause-title" class="pause-title">PAUSE</h2>

          <div class="pause-divider">
            <span></span>
          </div>
        </header>

        <div class="pause-menu">
          <button
            id="btn-pause-resume"
            class="sk-btn pause-primary"
            type="button"
          >
            <span class="btn-text">RESUME</span>
            <span class="btn-dec">&gt;&gt;</span>
          </button>

          <button id="btn-pause-restart" class="sk-btn" type="button">
            <span class="btn-text">RESTART SECTOR</span>
          </button>

          <button id="btn-pause-settings" class="sk-btn" type="button">
            <span class="btn-text">SETTINGS</span>
          </button>

          <button id="btn-pause-main-menu" class="sk-btn" type="button">
            <span class="btn-text">MAIN MENU</span>
          </button>
        </div>

        <div id="pause-settings-host" class="pause-settings-host" hidden></div>

        <div class="pause-footer">
          <span>ESC</span>
          <span id="pause-footer-text">RETURN TO GAME</span>
        </div>
      </section>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
          "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
        }
      }
    </script>

    <script type="module" src="js/main.js"></script>
    <div id="confirm-modal" class="modal-overlay hidden">
      <div
        class="cyber-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="confirm-new-game-text"
      >
        <div id="confirm-new-game-text" class="modal-text">
          PROGRESS WILL BE RESET.<br />
          ARE YOU SURE?
        </div>

        <div class="modal-actions">
          <button
            id="btn-confirm-yes"
            class="holo-btn active-state"
            type="button"
          >
            <span class="btn-text">YES</span>
          </button>

          <button id="btn-confirm-no" class="holo-btn" type="button">
            <span class="btn-text">CANCEL</span>
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
