<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google Room - Final Clean</title>
    <meta name="theme-color" content="#0b0f17" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3CradialGradient id='blueGrad' cx='30%25' cy='30%25' r='70%25'%3E%3Cstop offset='0%25' stop-color='%23fff'/%3E%3Cstop offset='100%25' stop-color='%234285F4'/%3E%3C/radialGradient%3E%3CradialGradient id='redGrad' cx='30%25' cy='30%25' r='70%25'%3E%3Cstop offset='0%25' stop-color='%23fff'/%3E%3Cstop offset='100%25' stop-color='%23EA4335'/%3E%3C/radialGradient%3E%3CradialGradient id='yellowGrad' cx='30%25' cy='30%25' r='70%25'%3E%3Cstop offset='0%25' stop-color='%23fff'/%3E%3Cstop offset='100%25' stop-color='%23FBBC05'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='45' r='40' fill='url(%23blueGrad)'/%3E%3Ccircle cx='72' cy='68' r='26' fill='url(%23redGrad)'/%3E%3Ccircle cx='38' cy='72' r='20' fill='url(%23yellowGrad)'/%3E%3C/svg%3E"
      type="image/svg+xml"
    />
    <link rel="stylesheet" href="css/style.css?v=2" />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="loading">
    <div id="loader-doors">
      <div class="loader-background-arcs">
        <div class="arc arc-1"></div>
        <div class="arc arc-2"></div>
        <div class="arc arc-3"></div>
      </div>

      <div class="door left-door">
        <div class="hex-pattern"></div>
        <div class="pcb-texture"></div>
        <div class="door-joint"></div>

        <div id="futuristic-start-menu" class="futuristic-start-menu">
          <div id="view-main" class="menu-view active">
            <button id="btn-start-game" class="sk-btn pulse-glow-volumetric">
              <span class="btn-text">НОВАЯ ИГРА</span>
              <span class="btn-dec">&gt;&gt;</span>
            </button>

            <button
              id="btn-resume-game"
              class="sk-btn resume-highlight locked-feature"
            >
              <span class="btn-text">ПРОДОЛЖИТЬ</span>
              <span class="btn-dec">&gt;&gt;</span>
              <div class="resume-energy-field"></div>
            </button>

            <button id="btn-open-settings" class="sk-btn">
              <span class="btn-text">НАСТРОЙКИ</span>
            </button>

            <button id="btn-exit" class="sk-btn exit-btn">
              <span class="btn-text btn-text-default">ВЫХОД</span>
              <span class="exit-joke">просто закрой вкладку :)</span>
            </button>
          </div>

          <div id="view-settings" class="menu-view">
  <button id="btn-back-main" class="holo-back-tab">
    <span class="btn-dec">&lt;&lt;</span>
    <span class="btn-text">ГЛАВНОЕ МЕНЮ</span>
  </button>

  <div class="settings-list">
    <div class="slider-group">
      <div class="slider-header">
        <span class="btn-text">ГРОМКОСТЬ ЭФФЕКТОВ</span>
        <span class="slider-value" id="val-sfx">70%</span>
      </div>
      <input type="range" id="slider-sfx" class="cyber-slider" min="0" max="100" value="70">
    </div>

    <div class="slider-group">
      <div class="slider-header">
        <span class="btn-text">ГРОМКОСТЬ МУЗЫКИ</span>
        <span class="slider-value" id="val-music">40%</span>
      </div>
      <input type="range" id="slider-music" class="cyber-slider" min="0" max="100" value="40">
    </div>

    <div id="btn-toggle-lang" class="lang-group slider-group">
      <div class="slider-header lang-header-style">
        <span class="btn-text">ЯЗЫК</span>
        <span class="status slider-value">RU</span>
      </div>
      <div class="lang-options">
        <button class="lang-btn" data-lang="EN">
          <span class="btn-text">ENGLISH</span>
        </button>
        <button class="lang-btn active-lang" data-lang="RU">
          <span class="btn-text">РУССКИЙ</span>
        </button>
      </div>
    </div>
  </div>
</div>
        </div>
      </div>

      <div class="door right-door">
        <img src="Image/mascot.png" class="menu-robot-image" alt="Айс" />

        <div class="hex-pattern"></div>
        <div class="pcb-texture"></div>
        <div class="door-joint"></div>

        <div class="title-container">
          <h1 class="cyber-title">GOOGLE ROOM</h1>
          <div class="cyber-subtitle">EXPERIMENTAL PHYSICS SANDBOX</div>
        </div>
      </div>

      <div class="loader-center-hub">
        <div class="vertical-joint-line"></div>

        <div class="cyber-core">
          <div class="core-ring outer-ring"></div>
          <div class="core-ring inner-ring"></div>
          <div class="core-center">
            <div class="core-text">A.I.C.E.</div>
            <div class="core-subtext">SYSTEMS</div>
          </div>
        </div>
      </div>
    </div>

    <div id="hud-controls" class="hud-hidden">
      <div id="hud-user-status" class="hud-user-badge hidden">
        <span class="status-dot"></span>
        <span id="hud-user-name">USER: UNKNOWN</span>
      </div>
      <button id="btn-restart-level" class="hud-btn">
        <img
          src="../Image/restart_icon.png"
          alt="Restart"
          class="restart-img-icon"
        />
      </button>

      <button id="btn-in-game-menu" class="hud-top-btn">
        <span class="btn-text">МЕНЮ</span>
      </button>
    </div>

    <div id="holo-wrapper" class="locked-feature">
      <div id="terminal-handle"><div id="handle-icon">SYSTEM</div></div>
      <div id="holo-panel">
        <div id="feature-word" class="locked-feature">
          <div class="section-title">WORD SELECTOR</div>
          <div class="word-control">
            <input
              type="text"
              id="word-input"
              value="GOOGLE"
              maxlength="8"
              autocomplete="off"
              spellcheck="false"
              placeholder="TYPE..."
            />
            <button
              id="btn-apply-word"
              class="icon-btn"
              data-action="applyWord"
            >
              ✔️
            </button>
          </div>
        </div>

        <div id="feature-mode" class="locked-feature">
          <div class="section-title">ATMOSPHERE MODE</div>
          <div class="mode-switch-container">
            <button
              id="mode-lab"
              class="mode-btn active"
              data-action="setModeLab"
            >
              LAB
            </button>
            <button id="mode-disco" class="mode-btn" data-action="setModeDisco">
              DISCO
            </button>
          </div>
        </div>

        <div id="feature-physics" class="locked-feature">
          <div class="section-title">PHYSICS CONTROL</div>
          <div class="actions-grid">
            <div class="combo-wrapper">
              <button
                id="btn-letters"
                class="combo-main-btn active-state"
                data-action="toggleLetters"
              >
                <span class="btn-icon">Ab</span>Letters
              </button>
              <button
                id="btn-reset-letters"
                class="combo-reset-btn"
                data-action="returnLetters"
              >
                RETURN
              </button>
            </div>
            <div class="combo-wrapper">
              <button
                id="btn-balls"
                class="combo-main-btn"
                data-action="spawnBalls"
              >
                <span class="btn-icon"
                  ><svg viewBox="0 0 24 24">
                    <circle cx="6" cy="15" r="4" />
                    <circle cx="18" cy="15" r="4" />
                    <circle cx="12" cy="7" r="4" /></svg></span
                >Beads
                <div id="bead-count" class="bead-counter">0/200</div>
              </button>
              <button
                id="btn-clear-balls"
                class="combo-reset-btn"
                title="Clear Beads"
                data-action="clearBalls"
              >
                CLEAR
              </button>
            </div>
            <button id="btn-slow" class="holo-btn" data-action="toggleSlowMo">
              <span class="btn-icon">🐢</span>Slo-Mo
            </button>
            <button id="btn-fans" class="holo-btn" data-action="toggleFans">
              <span class="btn-icon"
                ><svg class="stroked" viewBox="0 0 24 24">
                  <path d="M6 20 Q4 16 6 12 T6 4" />
                  <path d="M12 20 Q10 16 12 12 T12 4" />
                  <path d="M18 20 Q16 16 18 12 T18 4" /></svg></span
              >Air Floor
            </button>
          </div>
        </div>

        <div id="feature-equipment" class="locked-feature">
          <div class="section-title">EQUIPMENT</div>
          <div class="equipment-rack">
            <div class="tool-wrapper">
              <button
                id="btn-mag-main"
                class="mag-main-btn"
                data-action="togglePaletteMag"
              ></button>
              <div class="palette-container mag-palette">
                <div
                  id="mag-btn-0"
                  class="palette-item item-0"
                  data-color="0"
                  data-action="selectPaletteColor"
                  title="Green"
                ></div>
                <div
                  id="mag-btn-1"
                  class="palette-item item-1"
                  data-color="1"
                  data-action="selectPaletteColor"
                  title="Yellow"
                ></div>
                <div
                  id="mag-btn-2"
                  class="palette-item item-2"
                  data-color="2"
                  data-action="selectPaletteColor"
                  title="Red"
                ></div>
                <div
                  id="mag-btn-3"
                  class="palette-item item-3"
                  data-color="3"
                  data-action="selectPaletteColor"
                  title="Blue"
                ></div>
              </div>
            </div>
            <div class="tool-wrapper">
              <button
                id="btn-paint-main"
                class="mag-main-btn paint-btn"
                data-action="togglePalettePaint"
              ></button>
              <div class="palette-container paint-palette">
                <div
                  id="paint-btn-0"
                  class="palette-item item-0"
                  data-color="0"
                  data-action="selectPaletteColor"
                  title="Green"
                ></div>
                <div
                  id="paint-btn-1"
                  class="palette-item item-1"
                  data-color="1"
                  data-action="selectPaletteColor"
                  title="Yellow"
                ></div>
                <div
                  id="paint-btn-2"
                  class="palette-item item-2"
                  data-color="2"
                  data-action="selectPaletteColor"
                  title="Red"
                ></div>
                <div
                  id="paint-btn-3"
                  class="palette-item item-3"
                  data-color="3"
                  data-action="selectPaletteColor"
                  title="Blue"
                ></div>
              </div>
            </div>
          </div>
        </div>

        <div id="tool-hint" class="locked-feature">
          [ПКМ] — СБРОСИТЬ ИНСТРУМЕНТ
        </div>
      </div>
    </div>

    <div id="aice-dialogue-container" class="hidden">
      <div class="aice-portrait-wrap">
        <img
          src="../Image/robot-1.png"
          alt="A.I.C.E."
          id="aice-base"
          class="aice-layer base-layer"
        />
        <img src="../Image/eyes.png" alt="Eyes" class="aice-layer eyes-layer" />
        <img
          src="../Image/light.png"
          alt="Light"
          class="aice-layer beacon-layer"
        />
        <img
          src="../Image/smile.png"
          alt="Smile"
          class="aice-layer smile-layer"
        />
      </div>

      <div class="aice-dialogue-content">
        <div class="aice-nameplate">
          <span class="name-text">АЙС</span>
        </div>
        <div id="aice-dialogue-text" class="aice-dialogue-text"></div>

        <div id="bios-continue" class="bios-continue-prompt hidden">
          <span>[ ПРОДОЛЖИТЬ >> ]</span>
        </div>
      </div>
    </div>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
          "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
        }
      }
    </script>
    <script type="module" src="js/main.js"></script>

    <div id="confirm-modal" class="modal-overlay hidden">
      <div class="cyber-modal">
        <div class="modal-text">Are you sure?<br /></div>
        <div class="modal-actions">
          <button id="btn-confirm-yes" class="holo-btn active-state">
            <span class="btn-text">YES</span>
          </button>
          <button id="btn-confirm-no" class="holo-btn">
            <span class="btn-text">CANCEL</span>
          </button>
        </div>
      </div>
    </div>
    <div
      id="registration-modal"
      class="modal-overlay hidden"
      style="opacity: 0; transition: opacity 0.3s"
    >
      <div class="cyber-modal holo-glass-panel">
        <div class="registration-layout">
          <div class="aice-portrait-wrap center-aice">
            <img
              src="../Image/tablet-2.png"
              alt="AICE Base"
              class="aice-layer base-layer"
            />

            <img
              src="../Image/blinks-eyes-tablet-2.png"
              alt="Eyes"
              class="aice-layer tablet-eyes-layer"
            />

            <img
              src="../Image/light-tablet-2.png"
              alt="Light"
              class="aice-layer beacon-layer"
            />
          </div>

          <div class="registration-form">
            <div class="section-title">ТЕРМИНАЛ РЕГИСТРАЦИИ</div>
            <div
              id="reg-dialogue-text"
              class="aice-dialogue-text"
              style="min-height: 80px"
            ></div>

            <div class="input-group hidden" id="reg-input-group">
              <input
                type="text"
                id="player-name-input"
                class="cyber-input"
                placeholder="ВВЕДИТЕ ИМЯ..."
                maxlength="12"
                autocomplete="off"
                spellcheck="false"
              />
              <button id="btn-submit-name" class="holo-btn active-state">
                ВВОД
              </button>
            </div>

            <div class="choice-group hidden" id="reg-choice-group">
              <button id="btn-what-now" class="holo-btn">
                И что нам делать?
              </button>
              <button id="btn-accept-friend" class="holo-btn">
                ЛАДНО, БУДУ ДРУГОМ
              </button>
              <button id="btn-reject-friend" class="holo-btn">
                ОСТАВИТЬ МОЁ ИМЯ
              </button>
            </div>

            <div class="choice-group hidden" id="reg-final-group">
              <button
                id="btn-final-confirm"
                class="holo-btn active-state"
                style="width: 100%"
              >
                СПАСИБО
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
